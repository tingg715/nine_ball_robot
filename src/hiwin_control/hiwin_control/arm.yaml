# pot0~3 (2026-08-02 重測)
#
# 注意:這四個值「不是」上面 img_pot0~3 那組 ArUco 像素推出來的,不要照著
# aruco_table_cali_v2.py 的輸出去對。舊值是 ArUco + pinhole 推的,實測發現
# 它整體轉了 0.70 度(而且自己就不是矩形:近端邊 -0.081 度、遠端邊 -0.680 度),
# 造成的瞄準誤差隨球離近端左角的距離放大 —— 那就是策略瞄不準的原因。
#
# 新值的量法:球貼著四片庫邊放(長庫各4顆、短庫各3顆),讀 ball_coordinate_checker
# 的 homography 球心座標,四條球心線最小平方擬合,再各往外推一個球半徑 r=19
# 取交點。走的是跟打球時完全同一條量測通道,所以 homography 若有殘留偏差,
# 會在「球 -> 袋口」的瞄準向量裡抵消掉。
#
# 品質:長庫平行度 0.0073 度,各球離擬合線 <1.9mm,兩輪重複性 <1.0mm。
# 短庫強制垂直於長庫(桌子是矩形製造的;自由擬合只差 ±2.3mm)。
#
# z 沿用舊值:所有策略檔都只讀 [0:2],z 不參與計算。
#
# 已知未解:庫邊淨距量到 1103.7 x 540.8,標稱 1134 x 572,每邊短 13.6/15.6mm。
# 不影響瞄準(aimpoint 是球心線交點的實測值),疑似標稱值量的是桌面高度的庫底,
# 而球碰到的是較內縮的庫鼻。
